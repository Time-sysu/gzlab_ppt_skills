<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <desc>{{CONTENT_AREA}}：六列对照，顺序为名称、图片、要点、指标；底部仅保留一句结论。</desc>
  <g id="bg"><image href="content_bg.png" x="0" y="0" width="1280" height="720"/></g>
  <g id="header"><text x="82" y="48" font-family="Microsoft YaHei, Arial" font-size="32" font-weight="bold" fill="#0443AE">{{PAGE_TITLE}}</text></g>
  <g id="columns" font-family="Microsoft YaHei, Arial" text-anchor="middle" font-size="20">
    <rect x="39" y="114" width="184" height="448" fill="#FFFFFF" stroke="#7DACFC"/><rect x="39" y="114" width="184" height="53" fill="#0443AE"/><text x="131" y="149" fill="#FFFFFF">{{NAME_1}}</text><rect x="51" y="182" width="160" height="113" fill="#EAF2FB"/><text x="131" y="245" fill="#4472C4">{{IMAGE_1}}</text><text x="131" y="346" fill="#333F50">{{POINT_1}}</text><text x="131" y="438" fill="#0443AE" font-size="22">{{METRIC_1}}</text><text x="131" y="513" fill="#808080" font-size="18">{{NOTE_1}}</text>
    <rect x="241" y="114" width="184" height="448" fill="#FFFFFF" stroke="#7DACFC"/><rect x="241" y="114" width="184" height="53" fill="#0443AE"/><text x="333" y="149" fill="#FFFFFF">{{NAME_2}}</text><rect x="253" y="182" width="160" height="113" fill="#EAF2FB"/><text x="333" y="245" fill="#4472C4">{{IMAGE_2}}</text><text x="333" y="346" fill="#333F50">{{POINT_2}}</text><text x="333" y="438" fill="#0443AE" font-size="22">{{METRIC_2}}</text><text x="333" y="513" fill="#808080" font-size="18">{{NOTE_2}}</text>
    <rect x="443" y="114" width="184" height="448" fill="#FFFFFF" stroke="#7DACFC"/><rect x="443" y="114" width="184" height="53" fill="#0443AE"/><text x="535" y="149" fill="#FFFFFF">{{NAME_3}}</text><rect x="455" y="182" width="160" height="113" fill="#EAF2FB"/><text x="535" y="245" fill="#4472C4">{{IMAGE_3}}</text><text x="535" y="346" fill="#333F50">{{POINT_3}}</text><text x="535" y="438" fill="#0443AE" font-size="22">{{METRIC_3}}</text><text x="535" y="513" fill="#808080" font-size="18">{{NOTE_3}}</text>
    <rect x="645" y="114" width="184" height="448" fill="#FFFFFF" stroke="#7DACFC"/><rect x="645" y="114" width="184" height="53" fill="#4472C4"/><text x="737" y="149" fill="#FFFFFF">{{NAME_4}}</text><rect x="657" y="182" width="160" height="113" fill="#EAF2FB"/><text x="737" y="245" fill="#4472C4">{{IMAGE_4}}</text><text x="737" y="346" fill="#333F50">{{POINT_4}}</text><text x="737" y="438" fill="#0443AE" font-size="22">{{METRIC_4}}</text><text x="737" y="513" fill="#808080" font-size="18">{{NOTE_4}}</text>
    <rect x="847" y="114" width="184" height="448" fill="#FFFFFF" stroke="#7DACFC"/><rect x="847" y="114" width="184" height="53" fill="#4472C4"/><text x="939" y="149" fill="#FFFFFF">{{NAME_5}}</text><rect x="859" y="182" width="160" height="113" fill="#EAF2FB"/><text x="939" y="245" fill="#4472C4">{{IMAGE_5}}</text><text x="939" y="346" fill="#333F50">{{POINT_5}}</text><text x="939" y="438" fill="#0443AE" font-size="22">{{METRIC_5}}</text><text x="939" y="513" fill="#808080" font-size="18">{{NOTE_5}}</text>
    <rect x="1049" y="114" width="184" height="448" fill="#FFFFFF" stroke="#7DACFC"/><rect x="1049" y="114" width="184" height="53" fill="#00B050"/><text x="1141" y="149" fill="#FFFFFF">{{NAME_6}}</text><rect x="1061" y="182" width="160" height="113" fill="#EAF2FB"/><text x="1141" y="245" fill="#4472C4">{{IMAGE_6}}</text><text x="1141" y="346" fill="#333F50">{{POINT_6}}</text><text x="1141" y="438" fill="#0443AE" font-size="22">{{METRIC_6}}</text><text x="1141" y="513" fill="#808080" font-size="18">{{NOTE_6}}</text>
  </g>
  <g id="takeaway"><rect x="39" y="602" width="1194" height="80" rx="8" fill="#0443AE"/><text x="636" y="652" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="30" font-weight="bold" fill="#FFFFFF">{{TAKEAWAY}}</text></g>
  <g id="footer"><text x="1245" y="706" text-anchor="end" font-family="Microsoft YaHei, Arial" font-size="16" fill="#808080">{{PAGE_NUM}}</text></g>
