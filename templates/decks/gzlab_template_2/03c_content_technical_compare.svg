<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <desc>{{CONTENT_AREA}}：上方挑战到解决方案，下方旧方案图片、中央比较图和新方案图片；中央比较应采用真实数据。</desc>
  <defs><linearGradient id="arrow-brand" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0" stop-color="#808080"/><stop offset="0.3" stop-color="#00A871"/><stop offset="0.66" stop-color="#006EBD"/></linearGradient></defs>
  <g id="bg"><image href="content_bg.png" x="0" y="0" width="1280" height="720" preserveAspectRatio="none"/></g>
  <g id="header"><polygon points="41.83,31.28 90.28,31.28 101.03,49.15 90.28,67.02 41.83,67.02" fill="url(#arrow-brand)"/><text x="114.53" y="62.4" font-family="Microsoft YaHei, Arial" font-size="42.67" font-weight="bold" fill="#17191C">{{PAGE_TITLE}}</text><svg x="1098.31" y="10.82" width="181.66" height="75.06" viewBox="0 0.08826 1 0.91174" preserveAspectRatio="none"><image href="brand_logo.png" x="0" y="0" width="1" height="1" preserveAspectRatio="none"/></svg></g>
  <g id="challenge-solution" font-family="Microsoft YaHei, Arial" text-anchor="middle">
    <rect x="42" y="98" width="413" height="105" rx="10" fill="#EFF5FB"/><text x="249" y="138" font-size="26" font-weight="bold" fill="#0A4A7A">{{CHALLENGE_TITLE}}</text><text x="249" y="180" font-size="22" fill="#17191C">{{CHALLENGE_LINE}}</text>
    <polygon points="495,135 626,135 626,114 666,153 626,192 626,170 495,170" fill="#00A871"/>
    <rect x="695" y="98" width="560" height="105" rx="10" fill="#EFF5FB"/><text x="975" y="138" font-size="26" font-weight="bold" fill="#006EBD">{{SOLUTION_TITLE}}</text><text x="975" y="180" font-size="22" fill="#17191C">{{SOLUTION_LINE}}</text>
  </g>
  <g id="before" font-family="Microsoft YaHei, Arial" text-anchor="middle">
    <rect x="45" y="224" width="338" height="471" rx="8" fill="#FFFFFF" stroke="#E3E6EA"/><rect x="45" y="224" width="338" height="59" fill="#0A4A7A"/>
    <text x="214" y="263" font-size="26" fill="#FFFFFF">{{BEFORE_TITLE}}</text><rect x="62" y="302" width="304" height="288" fill="#EFF5FB"/><text x="214" y="454" font-size="25" fill="#006EBD">{{BEFORE_IMAGE}}</text><text x="214" y="649" font-size="22" fill="#17191C">{{BEFORE_CAPTION}}</text>
  </g>
  <g id="comparison" font-family="Microsoft YaHei, Arial" text-anchor="middle">
    <text x="587" y="298" font-size="26" font-weight="bold" fill="#17191C">{{COMPARE_TITLE}}</text><rect x="419" y="326" width="331" height="281" fill="#EFF5FB" stroke="#E3E6EA"/><text x="585" y="474" font-size="24" fill="#006EBD">{{COMPARE_CHART}}</text><text x="585" y="657" font-size="24" font-weight="bold" fill="#00A871">{{KEY_ADVANTAGE}}</text>
  </g>
  <g id="after" font-family="Microsoft YaHei, Arial" text-anchor="middle">
    <rect x="791" y="224" width="462" height="471" rx="8" fill="#FFFFFF" stroke="#E3E6EA"/><rect x="791" y="224" width="462" height="59" fill="#006EBD"/>
    <text x="1022" y="263" font-size="26" fill="#FFFFFF">{{AFTER_TITLE}}</text><rect x="809" y="302" width="426" height="288" fill="#EFF5FB"/><text x="1022" y="454" font-size="25" fill="#006EBD">{{AFTER_IMAGE}}</text><text x="1022" y="649" font-size="22" fill="#17191C">{{AFTER_CAPTION}}</text>
  </g>
  <g id="footer"><text x="1248" y="716" text-anchor="end" font-family="Microsoft YaHei, Arial" font-size="16" fill="#6B7280">{{PAGE_NUM}}</text></g>
</svg>
