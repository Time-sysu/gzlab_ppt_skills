<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs><linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#92D050"/><stop offset="1" stop-color="#2E75B6"/></linearGradient></defs>
  <g id="background"><rect width="1280" height="720" fill="#FFFFFF"/></g>
  <g id="header"><rect x="0" y="0" width="997" height="79" fill="#2E75B6"/><rect x="0" y="0" width="80" height="32" fill="url(#brandGrad)"/><text x="88" y="52" font-family="&quot;Microsoft YaHei&quot;, sans-serif" font-size="32" font-weight="bold" fill="#FFFFFF">{{PAGE_TITLE}}</text><image href="brand_logo.png" x="1005" y="6" width="246" height="68" preserveAspectRatio="xMidYMid meet"/></g>
  <g id="figure-panel"><rect x="92" y="118" width="1096" height="446" rx="12" fill="#F8FBFD" stroke="#2E75B6" stroke-width="2" stroke-dasharray="4,4"/><text x="640" y="336" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, sans-serif" font-size="26" fill="#94A3B8">{{FIGURE}}</text></g>
  <g id="figure-caption"><text x="640" y="589" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, sans-serif" font-size="18" fill="#64748B">{{FIGURE_CAPTION}}</text></g>
  <g id="takeaway"><rect x="160" y="614" width="960" height="42" rx="10" fill="#2E75B6"/><text x="640" y="641" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, sans-serif" font-size="19" font-weight="bold" fill="#FFFFFF">{{KEY_MESSAGE}}</text></g>
  <g id="footer"><text x="1238" y="690" text-anchor="end" font-family="&quot;Times New Roman&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" fill="#64748B">{{PAGE_NUM}}</text></g>
</svg>
