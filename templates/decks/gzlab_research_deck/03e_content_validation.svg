  <g id="takeaway"><rect x="176" y="570" width="928" height="58" rx="14" fill="#2E75B6"/><rect x="176" y="570" width="14" height="58" rx="7" fill="#92D050"/><text x="640" y="606" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, sans-serif" font-size="21" font-weight="bold" fill="#FFFFFF">{{KEY_MESSAGE}}</text></g>
