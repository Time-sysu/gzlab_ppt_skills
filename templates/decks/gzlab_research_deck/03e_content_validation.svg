  <g id="validation-right"><rect x="689" y="122" width="535" height="410" rx="12" fill="#F8FBFD" stroke="#2E75B6" stroke-width="2" stroke-dasharray="4,4"/><text x="956" y="316" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, sans-serif" font-size="24" fill="#94A3B8">{{RIGHT_FIGURE}}</text><rect x="689" y="486" width="535" height="46" fill="#EAF3FA"/><text x="956" y="516" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, sans-serif" font-size="19" font-weight="bold" fill="#2E75B6">{{RIGHT_CAPTION}}</text></g>
